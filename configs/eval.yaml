# Evaluation settings. The decision threshold is chosen on val only, then applied unchanged to test.

threshold:
  method: youden            # youden = max(sensitivity + specificity - 1)
                            # min_sensitivity = best specificity with sensitivity >= target_sensitivity
  target_sensitivity: 0.95  # used only by min_sensitivity

bootstrap:                  # 95% CI on test, resampling each class separately
  n_boot: 1000
  confidence: 0.95
  seed: 0

acceptance:                 # D6 in docs/decisions.md; passed = point estimate >= value on test
  auc: 0.93
  sensitivity: 0.90
  specificity: 0.75
